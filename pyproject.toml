[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B"]
ignore = [
    "B008",   # FastAPI Depends() in argument defaults is the idiomatic pattern
]

[tool.ruff.lint.per-file-ignores]
# inline-styled email HTML: splitting the CSS strings hurts readability more than long lines
"app/notifications/welcome.py" = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
check_untyped_defs = true
warn_unused_ignores = true
